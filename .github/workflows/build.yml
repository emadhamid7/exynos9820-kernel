name: build-ksun
on:
  push:
    branches: [sixteen]
    paths: [.github/workflows/build-ksun.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1xks, d2s, d2x, d2xks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools cpio zip bc bison flex libssl-dev python3
      - name: Build ${{ matrix.model }}
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ matrix.model }} -k y
      - name: Tidy zip name
        run: |
          cd build/out/${{ matrix.model }}
          for f in *.zip; do mv "$f" "${f//_UNOFFICIAL/}"; done
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}
          path: build/out/${{ matrix.model }}/*.zip
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check zips
        run: ls -la out/*.zip
      - name: Upload to Gofile
        continue-on-error: true
        run: |
          for f in out/*.zip; do
            curl -s -F "file=@$f" https://upload.gofile.io/uploadfile | grep -o '"downloadPage":"[^"]*"' || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ksun-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ExtremeKernel KSU-Next build ${{ github.run_number }}
          body: KernelSU-Next d51ca52 with scope-min manual hooks. All models.
          prerelease: true
          files: out/*.zip
